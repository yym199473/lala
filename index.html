
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>绿色封面</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    padding:20px 14px;
}

/* 整行 */
.card-row{
    width:100%;
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}

/* 绿色封面气泡 */
.green-card{
    position:relative;

    display:inline-block;

    max-width:92%;
    min-width:180px;

    background:#95ec69;

    border-radius:
        10px 10px 4px 10px;

    padding:
        10px
        16px
        16px
        16px;

    color:#111;

    font-size:17px;
    line-height:1.55;

    letter-spacing:.1px;

    word-break:break-word;
    white-space:pre-wrap;

    user-select:none;
    -webkit-user-select:none;

    cursor:default;

    box-shadow:
        0 1px 2px
        rgba(0,0,0,.06);
}

/* 右侧小尾巴 */
.green-card::after{
    content:"";

    position:absolute;

    right:-8px;
    top:16px;

    width:0;
    height:0;

    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
    border-left:9px solid #95ec69;
}

/* 文字稍微往上一点 */
.card-text{
    position:relative;
    top:-2px;

    text-align:left;
}

/* 防止点击产生操作 */
.green-card,
.green-card *{
    pointer-events:none;
}
</style>
</head>

<body>

<div class="card-row">

    <div class="green-card">

        <div
        class="card-text"
        id="cardText"
        >
你好，今天方便吗？可以，晚一点联系。文件已经收到。好的。
        </div>

    </div>

</div>

<script>

/*
以后要改文字，
只改下面双引号里面这一段。
*/

const coverText =
"你好，今天方便吗？可以，晚一点联系。文件已经收到。好的。";

document.getElementById(
    "cardText"
).textContent = coverText;

</script>

</body>
</html>
